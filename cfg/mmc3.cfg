# Configuration ld65 : cartouche MMC3 (TxROM), 128 Ko PRG, 32 Ko CHR, 8 Ko PRG-RAM.
# Banques PRG de 8 Ko. Les deux dernières ($C000-$FFFF) sont fixes (mode PRG 0).
MEMORY {
    ZP:      start = $0000, size = $0100, type = rw;
    OAMRAM:  start = $0200, size = $0100, type = rw;
    RAM:     start = $0300, size = $0500, type = rw;
    WRAM:    start = $6000, size = $2000, type = rw;

    HEADER:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG00:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG01:   start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRGPAD:  start = $8000, size = $18000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRGC:    start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRGE:    start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:     start = $0000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAMRAM, type = bss, align = $100;
    BSS:      load = RAM,    type = bss;
    WRAM:     load = WRAM,   type = bss;
    BANK00:   load = PRG00,  type = ro;
    CODE:     load = PRGC,   type = ro;
    DATA:     load = PRGC,   type = ro;
    FIXED:    load = PRGE,   type = ro;
    RODATA:   load = PRGE,   type = ro;
    VECTORS:  load = PRGE,   type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
